name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned toolchain versions used by the jobs below.
  EMSDK_VERSION: 6.0.13
  DART_SDK_VERSION: 3.13.5
  NODE_VERSION: 24

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The prebuilt Dawn is built with MSVC 19.51 (VS 2026) on this image;
          # older toolsets cannot link it (newer STL vectorized helpers).
          - name: Windows MSVC (Debug)
            os: windows-2025-vs2026
            build_type: Debug
          - name: Windows MSVC (Release)
            os: windows-2025-vs2026
            build_type: Release
          - name: macOS Clang (Debug)
            os: macos-15
            build_type: Debug
          # Golden reference configuration: Linux + Mesa lavapipe.
          - name: Linux GCC (Debug, golden reference)
            os: ubuntu-24.04
            build_type: Debug
            cmake_args: -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
            dart: true
          - name: Linux GCC (Release)
            os: ubuntu-24.04
            build_type: Release
            cmake_args: -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          - name: Linux Clang ASan+UBSan
            os: ubuntu-24.04
            build_type: Debug
            cmake_args: >-
              -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
              -DUI_ENABLE_ASAN=ON -DUI_ENABLE_UBSAN=ON
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies (lavapipe, X11, Wayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev
          dpkg -s mesa-vulkan-drivers | grep '^Version'

      - name: Cache pinned dependencies (Dawn, SDL3)
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/ui_dependencies.cmake') }}

      - name: Set up Dart
        if: matrix.dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DUI_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Upload golden-image failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures-${{ matrix.os }}-${{ matrix.build_type }}-${{ strategy.job-index }}
          path: build/golden-failures
          if-no-files-found: ignore

  emscripten:
    name: Emscripten (Node, emdawnwebgpu, TypeScript)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache pinned dependencies (emdawnwebgpu)
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-emscripten-${{ hashFiles('cmake/ui_dependencies.cmake') }}

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure
        run: emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DUI_WARNINGS_AS_ERRORS=ON

      - name: Build (renderer with emdawnwebgpu, C API ES module)
        run: cmake --build build --parallel

      # Includes the TypeScript binding smoke test against axeui.mjs.
      - name: Test under Node
        run: ctest --test-dir build --output-on-failure

      - name: Type-check the TypeScript bindings
        working-directory: bindings/typescript
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .

  api:
    name: C API description and generated files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Generated files match api/ui_api.json
        run: python3 tools/gen_api.py --check

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: pipx install clang-format==18.1.8
      - name: Check formatting
        run: |
          git ls-files '*.h' '*.c' '*.cpp' ':!:third_party/**' ':!:include/ui/ui.h' \
            | xargs clang-format --dry-run --Werror
